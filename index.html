<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#12232a"><link rel="manifest" href="manifest.webmanifest"><title>TIMEVALUE</title><style>*{box-sizing:border-box}body{font-family:system-ui;background:#0d171d;color:#e9f7f3;max-width:760px;margin:auto}header{background:#172b33;padding:18px;position:sticky;top:0}h1{margin:0;letter-spacing:2px}small,p.hint{color:#a9c0bf}nav{display:flex;gap:6px;margin-top:12px}button{cursor:pointer;background:#27434c;border:1px solid #45616a;color:white;border-radius:9px;padding:10px;font:inherit}button.primary{background:#8be8c7;color:#09291d;font-weight:bold}nav button{flex:1;font-size:13px}main{padding:12px}section{background:#192b33;border:1px solid #36525b;border-radius:14px;padding:14px;margin:12px 0}h2{font-size:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#27414a;border-radius:10px;padding:12px}.stat b{display:block;color:#9ceaca;font-size:22px}.stat small{font-size:12px}label{display:block;font-size:13px;margin:8px 0;color:#c2d4d2}input,select{width:100%;padding:11px;background:#102028;color:white;border:1px solid #49626b;border-radius:8px;font:inherit;font-size:16px}.row{display:flex;justify-content:space-between;gap:8px;align-items:center}.actions{display:flex;gap:7px}.actions button{flex:1}.hint{font-size:13px}footer{text-align:center;padding:20px;color:#8ba5a5;font-size:12px}</style></head><body><header><h1>TIMEVALUE<span style="color:#8be8c7">.</span></h1><small>Make your hours count.</small><nav><button onclick="page='compare';render()">Compare</button><button onclick="page='goal';render()">Income goal</button><button onclick="page='freedom';render()">Freedom</button><button onclick="page='backup';render()">Backup</button></nav></header><main id="app"></main><footer>Estimates only. Stored on this device. Export backups regularly.</footer><script>
const KEY='timevalue-v1';const $=id=>document.getElementById(id),uid=()=>crypto.randomUUID(),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>Number.isFinite(n)?n.toLocaleString('en-US',{style:'currency',currency:'USD'}):'—',num=n=>Number.isFinite(n)?n.toFixed(1):'—';
const starter=()=>({jobs:[{id:uid(),name:'Full-time job',type:'hourly',pay:20,hours:40,days:5,commute:30,prep:15,expenses:25,tax:18,weeks:50},{id:uid(),name:'Part-time job',type:'hourly',pay:30,hours:25,days:5,commute:15,prep:10,expenses:10,tax:18,weeks:50}],target:2500,targetHours:25,targetTax:18,targetWeeks:50});let db;try{db=JSON.parse(localStorage.getItem(KEY))||starter();if(!Array.isArray(db.jobs))throw Error()}catch{db=starter()}let page='compare',editing=null;function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch{alert('Storage unavailable. Export backup.')}}
function calc(j){let weeks=+j.weeks||0,work=(+j.hours||0)*weeks,life=((+j.hours||0)+(+j.days||0)*((+j.commute||0)+(+j.prep||0))/60)*weeks,gross=j.type==='annual'?+j.pay:(+j.pay||0)*work,net=Math.max(0,gross*(1-(+j.tax||0)/100)-(+j.expenses||0)*weeks);return{life,net,monthly:net/12,rate:life?net/life:0,weekly:weeks?life/weeks:0}}
function stats(j){let c=calc(j);return `<div class="grid"><div class="stat"><small>Real hourly value</small><b>${money(c.rate)}</b></div><div class="stat"><small>Monthly take-home</small><b>${money(c.monthly)}</b></div><div class="stat"><small>Life hours / week</small><b>${num(c.weekly)}h</b></div><div class="stat"><small>Annual take-home</small><b>${money(c.net)}</b></div></div>`}
function render(){let a=$('app');if(page==='compare'){a.innerHTML=`<div class="row"><h2>Compare opportunities</h2><button class="primary" onclick="newJob()">+ Add job</button></div><p class="hint">Real hourly value includes commute, preparation, expenses and estimated taxes.</p>`+db.jobs.slice().sort((x,y)=>calc(y).rate-calc(x).rate).map(j=>`<section><h3>${esc(j.name)}</h3>${stats(j)}<p class="hint">${j.type==='annual'?'Annual salary':'Hourly pay'}: ${money(j.pay)} · ${j.hours} paid hours/week</p><div class="actions"><button onclick="editJob('${j.id}')">Edit</button><button onclick="duplicate('${j.id}')">Duplicate</button><button onclick="removeJob('${j.id}')">Delete</button></div></section>`).join('')}
else if(page==='edit'){let j=editing;a.innerHTML=`<h2>Edit opportunity</h2><section><label>Name<input id="name" value="${esc(j.name)}"></label><label>Pay type<select id="type"><option value="hourly" ${j.type==='hourly'?'selected':''}>Hourly</option><option value="annual" ${j.type==='annual'?'selected':''}>Annual salary</option></select></label><div class="grid">${[['pay','Pay ($)'],['hours','Paid hours/week'],['days','Days/week'],['commute','Round-trip commute minutes/day'],['prep','Preparation minutes/day'],['expenses','Work expenses $/week'],['tax','Estimated effective tax %'],['weeks','Paid weeks/year']].map(([k,l])=>`<label>${l}<input id="${k}" type="number" min="0" step="any" value="${j[k]}"></label>`).join('')}</div><p class="hint">For salary, enter annual gross pay. For hourly, enter gross hourly pay. Effective tax is a simplified estimate.</p><div class="actions"><button class="primary" onclick="saveJob()">Save</button><button onclick="page='compare';render()">Cancel</button></div></section>`}
else if(page==='goal'){let h=+db.targetHours,w=+db.targetWeeks,t=+db.targetTax;let rate=h*w&&t<100?(db.target*12/(1-t/100))/(h*w):NaN;a.innerHTML=`<h2>Income goal</h2><section><div class="grid"><label>Monthly take-home target $<input id="target" type="number" value="${db.target}"></label><label>Paid hours/week<input id="targetHours" type="number" value="${h}"></label><label>Estimated tax %<input id="targetTax" type="number" value="${t}"></label><label>Paid weeks/year<input id="targetWeeks" type="number" value="${w}"></label></div><button class="primary" onclick="saveGoal()">Calculate</button></section><section class="stat"><small>Required gross hourly pay</small><b>${money(rate)}</b></section><p class="hint">Simplified estimate; excludes work expenses and commuting.</p>`}
else if(page==='freedom'){if(db.jobs.length<2){a.innerHTML='<h2>Freedom</h2><p>Add two opportunities first.</p>';return}let opts=db.jobs.map(j=>`<option value="${j.id}">${esc(j.name)}</option>`).join('');a.innerHTML=`<h2>Freedom comparison</h2><section class="grid"><label>Current<select id="from" onchange="freedomResult()">${opts}</select></label><label>Alternative<select id="to" onchange="freedomResult()">${opts}</select></label></section><section id="result"></section>`;$('to').selectedIndex=1;freedomResult()}
else a.innerHTML=`<h2>Backup & restore</h2><section><p>Data stays in this browser. Back up before updating or clearing browser data.</p><button class="primary" onclick="backup()">Download backup</button></section><section><p>Restore replaces all current records.</p><input type="file" accept=".json,application/json" onchange="restore(this.files[0])"></section>`}
function newJob(){editing={id:uid(),name:'New opportunity',type:'hourly',pay:25,hours:30,days:5,commute:0,prep:0,expenses:0,tax:20,weeks:50};page='edit';render()}function editJob(id){editing={...db.jobs.find(j=>j.id===id)};page='edit';render()}function saveJob(){let j={...editing,name:$('name').value.trim(),type:$('type').value};if(!j.name)return alert('Enter a name');for(let k of ['pay','hours','days','commute','prep','expenses','tax','weeks']){j[k]=Number($(k).value);if(!Number.isFinite(j[k])||j[k]<0)return alert('Check '+k)}if(j.days>7||j.weeks>52||j.tax>100)return alert('Check days, weeks and tax');let i=db.jobs.findIndex(x=>x.id===j.id);if(i<0)db.jobs.push(j);else db.jobs[i]=j;save();page='compare';render()}function duplicate(id){let j=db.jobs.find(x=>x.id===id);db.jobs.push({...j,id:uid(),name:j.name+' copy'});save();render()}function removeJob(id){if(confirm('Delete this job?')){db.jobs=db.jobs.filter(j=>j.id!==id);save();render()}}function saveGoal(){for(let k of ['target','targetHours','targetTax','targetWeeks'])db[k]=Math.max(0,Number($(k).value)||0);db.targetTax=Math.min(99,db.targetTax);db.targetWeeks=Math.min(52,db.targetWeeks);save();render()}
function freedomResult(){let a=calc(db.jobs.find(j=>j.id===$('from').value)),b=calc(db.jobs.find(j=>j.id===$('to').value)),hrs=a.life-b.life,diff=b.net-a.net;let trade=hrs>0&&diff<0?`Each extra free hour costs ${money(-diff/hrs)} in take-home income.`:hrs<0&&diff>0?`Each extra committed hour earns ${money(diff/-hrs)}.`:'Compare the trade-offs above.';$('result').innerHTML=`<div class="grid"><div class="stat"><small>Annual hours freed</small><b>${num(hrs)}h</b></div><div class="stat"><small>Annual income change</small><b>${money(diff)}</b></div><div class="stat"><small>Monthly income change</small><b>${money(diff/12)}</b></div><div class="stat"><small>Hourly value change</small><b>${money(b.rate-a.rate)}</b></div></div><p>${trade}</p>`}
function backup(){let u=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='timevalue-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),3000)}async function restore(f){if(!f)return;try{if(f.size>2e6)throw Error('Too large');let d=JSON.parse(await f.text());if(!Array.isArray(d.jobs)||d.jobs.some(j=>!j.id||typeof j.name!=='string'))throw Error('Invalid backup');if(confirm('Replace all saved jobs?')){db=d;save();page='compare';render()}}catch(e){alert('Restore failed: '+e.message)}}save();render();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
